# Merge policy for `attest policy evaluate --report <report> --policy attest.policy.yaml`.
# Exit 0: pass. Exit 1: a blocking rule failed. Exit 2: warnings only.
layers:
  0:  # layer 0 caps every layer together
    max_hard_fails: 0
# Assertions that could not run (no judge configured, simulation) warn instead of block.
not_evaluated: warn
# 1.1 changes C3 assertion/baseline identity: the 1.0 main reports are not a
# compatible regression baseline. Keep this disabled in the release pin diff;
# re-enable only after main has produced a fresh 1.1 baseline for every example.
block_on_regression: false
