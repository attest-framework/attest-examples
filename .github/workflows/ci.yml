name: Examples CI

# Every example runs on the published attest release it pins, against the real
# engine. Layers 1-4 and 7 evaluate for real; judge and embedding assertions
# have no provider key in CI, so their tests skip as not evaluated
# (provider_not_configured) and the policy warns (exit 2) instead of passing.
#
# Per example: the test step records its outcome and continues, so the Attest
# report is always uploaded and the merge policy evaluated; the last step fails the
# job when the tests failed. Each example also asserts "0 live model calls" from its
# report (.github/scripts/assert-no-live-calls.sh). The jobs that run example code
# hold no write permission: the `annotate` job downloads every report and posts the
# one summary comment and the annotations (pr-annotate v2).
#
# Parallel runners: pytest runs with `-n auto` (the pytest plugin aggregates the worker
# reports into one report-v2) and Vitest keeps its default pools.
#
# Baseline: every run uploads its reports. A pull request job downloads the reports of the
# latest successful push run on main (actions: read), pins them in the job as tag `main` and
# evaluates the policy with --baseline main. attest.policy.yaml sets block_on_regression, so
# BASELINE_REQUIRED=true: a missing main report fails the job ("re-run CI on main"), except
# for an example that does not exist on main yet.
#
# `required` is the single check the ruleset requires. It runs always() and fails when any
# job failed or was cancelled.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BASELINE_REQUIRED: "true"

jobs:
  python-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - quickstart
          - continuous-eval
          - crewai-adapter
          - customer-service-agent
          - drift-detection
          - google-adk
          - langchain-agent
          - llamaindex-agent
          - llm-judge
          - multi-agent-workflow
          - plugin-system
          - rag-chatbot
          - semantic-similarity
          - simulation
          - relational-effects
          - pydantic-ai
          - openai-agents
          - langgraph
          - claude-agent-sdk
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        id: tests
        continue-on-error: true
        # Report paths stay relative to the example; the annotate job prefixes the
        # report's directory so annotations land on the pull request diff.
        run: uv run pytest -v -n auto --attest-report=attest-report.json
      - name: Assert zero live model calls
        if: always()
        working-directory: .
        env:
          EXAMPLE: ${{ matrix.example }}
        run: .github/scripts/assert-no-live-calls.sh "$EXAMPLE" "$EXAMPLE/attest-report.json"
      - name: Upload the Attest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-report-${{ matrix.example }}
          path: ${{ matrix.example }}/attest-report.json
          if-no-files-found: error
      - name: Fetch the main report
        id: baseline
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXAMPLE: ${{ matrix.example }}
        run: .github/scripts/fetch-main-report.sh "attest-report-$EXAMPLE" "$RUNNER_TEMP/main-report"
      - name: Evaluate the merge policy
        if: always()
        env:
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          MAIN_REPORT_DIR: ${{ runner.temp }}/main-report
        run: ../.github/scripts/evaluate-policy.sh uv run attest
      - name: Fail the job when tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::pytest failed; see the Run tests step"
          exit 1

  typescript-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        example:
          - quickstart-ts
          - schema-assertions-ts
          - content-assertions-ts
          - openai-adapter-ts
          - relational-effects-ts
          - vercel-ai-ts
          - mastra-ts
          - claude-agent-sdk-ts
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # evaluate-policy.sh strips regression rules with PyYAML through uv when no baseline is usable.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the attest engine
        # The first test would otherwise download the engine inside Vitest's 5 s test timeout,
        # which a slow release CDN exceeds. `attest doctor` fetches it here, with retries.
        run: |
          for attempt in 1 2 3 4; do
            pnpm exec attest doctor && exit 0
            echo "::warning::engine download failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        id: tests
        continue-on-error: true
        run: >-
          pnpm exec vitest run --reporter=default --reporter=@attest-ai/vitest/reporter
          --outputFile.attest=attest-report.json
      - name: Assert zero live model calls
        if: always()
        working-directory: .
        env:
          EXAMPLE: ${{ matrix.example }}
        run: .github/scripts/assert-no-live-calls.sh "$EXAMPLE" "$EXAMPLE/attest-report.json"
      - name: Upload the Attest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attest-report-${{ matrix.example }}
          path: ${{ matrix.example }}/attest-report.json
          if-no-files-found: error
      - name: Fetch the main report
        id: baseline
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXAMPLE: ${{ matrix.example }}
        run: .github/scripts/fetch-main-report.sh "attest-report-$EXAMPLE" "$RUNNER_TEMP/main-report"
      - name: Evaluate the merge policy
        if: always()
        env:
          BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
          MAIN_REPORT_DIR: ${{ runner.temp }}/main-report
        run: ../.github/scripts/evaluate-policy.sh pnpm exec attest
      - name: Fail the job when tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "::error::vitest failed; see the Run tests step"
          exit 1

  # Posts the one summary comment and the annotations for every example (pr-annotate v2).
  # It is the only job with `pull-requests: write`, so it runs no example code: it downloads
  # the report artifacts (data), then runs attest-ai==1.0.1 and pr-annotate, both pinned
  # to a release. Every action here is pinned by commit SHA, the uv cache is disabled (the
  # example jobs populate it from pull-request code) and uvx runs outside the checkout with
  # --no-config. Fork pull requests run it with a read-only token: pr-annotate then emits the
  # ::error/::warning annotations and the job summary and skips the comment.
  annotate:
    name: annotate the pull request
    needs: [python-examples, typescript-examples]
    if: "!cancelled() && github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: attest-report-*
          path: attest-reports
      - name: Place each report beside its example
        id: reports
        # pr-annotate prefixes each row's file with the report's directory, so the report
        # goes where the tests ran from.
        run: |
          set -eu
          shopt -s nullglob
          paths=""
          for dir in attest-reports/attest-report-*/; do
            example="${dir#attest-reports/attest-report-}"
            example="${example%/}"
            case "$example" in
              ''|*[!A-Za-z0-9_-]*) echo "::error::unexpected report artifact name: $dir"; exit 1 ;;
            esac
            [ -d "$example" ] || { echo "::error::no example directory for report artifact: $example"; exit 1; }
            mv "${dir}attest-report.json" "$example/attest-report.json"
            paths="${paths}${example}/attest-report.json"$'\n'
          done
          { echo "paths<<EOF"; printf '%s' "$paths"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          # The example jobs run pull-request code and populate the uv cache; this job holds
          # the write token and must not restore it.
          enable-cache: false
      - name: Cache the attest engine
        # pr-annotate calls attest-engine and never downloads it: the first `attest`
        # command of the pinned release fetches it into ~/.attest/bin/<version>/. The
        # attest-ai version below must match the pr-annotate pin (v1.0.1 = 1.0.1), or
        # the action looks in a cache directory that was never filled.
        # Run outside the PR checkout without project config, so nothing the pull request
        # controls (uv.toml, pyproject.toml) steers the install in this write-permission job.
        working-directory: ${{ runner.temp }}
        run: uvx --no-config --from "attest-ai==1.0.1" attest doctor
      - name: Fetch the main reports
        id: main
        # The example jobs enforce the baseline; here it only enriches the annotations, so a
        # missing baseline or a failed download (artifact storage answers 503 under load)
        # annotates without one instead of failing the job.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/fetch-main-report.sh 'attest-report-*' "$RUNNER_TEMP/main-reports"
      - name: Pin the main baseline
        id: pin
        # A baseline tag holds one report: merge the example reports and pin the result.
        # A merge failure (e.g. the same assertion id in two examples) must not fail
        # annotation: the step is non-fatal, the next step warns, and annotate runs without
        # baseline-tag. Per-example regression gating stays in the example jobs.
        if: steps.main.outputs.found == 'true'
        continue-on-error: true
        env:
          MAIN_REPORTS_DIR: ${{ runner.temp }}/main-reports
          MERGED_REPORT: ${{ runner.temp }}/main-merged.json
        run: |
          set -eu
          find "$MAIN_REPORTS_DIR" -name attest-report.json -print0 \
            | xargs -0 python3 -I .github/scripts/merge-reports.py "$MERGED_REPORT"
          (cd "$RUNNER_TEMP" && uvx --no-config --from "attest-ai==1.0.1" attest baseline pin --tag main --report "$MERGED_REPORT")
      - name: Warn when the baseline could not be fetched or pinned
        if: steps.main.outcome == 'failure' || steps.pin.outcome == 'failure'
        run: echo "::warning::could not fetch, merge or pin the main reports; annotating without a baseline (per-example regression gating still runs in the example jobs)"
      - name: Drop the regression rules from the policy
        id: policy
        # Without a pinned baseline `policy evaluate` exits 3 once the policy carries
        # block_on_regression or regression, and pr-annotate fails on that. Evaluate the
        # policy minus those rules instead; per-example regression gating stays in the
        # example jobs.
        if: steps.pin.outcome != 'success'
        env:
          POLICY_OUT: ${{ runner.temp }}/policy-no-regression.json
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          uv run --no-project --no-config --with pyyaml==6.0.2 python \
            "$GITHUB_WORKSPACE/.github/scripts/strip-regression-rules.py" \
            "$GITHUB_WORKSPACE/attest.policy.yaml" "$POLICY_OUT"
          echo "path=$POLICY_OUT" >> "$GITHUB_OUTPUT"
      - name: Summarise and annotate
        uses: attest-framework/attest/.github/actions/pr-annotate@5d5b748b13da7ba034b3acfce631cee8fcae720c # v1.0.1
        with:
          report: ${{ steps.reports.outputs.paths }}
          policy: ${{ steps.policy.outputs.path || 'attest.policy.yaml' }}
          baseline-tag: ${{ steps.pin.outcome == 'success' && 'main' || '' }}
          # The example jobs already fail on a blocking violation.
          fail-on-violation: "false"

  # The one check a ruleset requires. Advisory jobs (edge) are skipped here; every other job
  # must have passed or been skipped (annotate is skipped on pushes).
  required:
    name: required
    needs: [python-examples, typescript-examples, annotate, edge]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a required job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.key != "edge") | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$bad" ]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi

  # Advisory: runs every example against attest main (unreleased), so a change on
  # main that would break the examples shows up before the next release. Its
  # failure does not block a pull request; the released-pin jobs above do.
  edge:
    name: edge (attest main, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: attest-framework/attest/.github/actions/setup-attest@0b2283542b288b6e1ef54af0c37b5e77339921f6 # v1.0.0-rc.1
        id: attest
        with:
          ref: main
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - name: Python examples on attest main
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
          ATTEST_SOURCE: ${{ steps.attest.outputs.source-dir }}
        run: |
          set -uo pipefail
          failed=()
          for dir in */; do
            [ -f "$dir/pyproject.toml" ] || continue
            echo "::group::$dir"
            (cd "$dir" && uv sync && uv pip install -e "$ATTEST_SOURCE/sdks/python" && uv run --no-sync pytest -v) \
              || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed on attest main: ${failed[*]}"
            exit 1
          fi
      - name: TypeScript examples on attest main
        if: always()
        env:
          ATTEST_ENGINE_PATH: ${{ steps.attest.outputs.engine-path }}
          CORE_TARBALL: ${{ steps.attest.outputs.core-tarball }}
          VITEST_TARBALL: ${{ steps.attest.outputs.vitest-tarball }}
        run: |
          set -uo pipefail
          failed=()
          for dir in *-ts/; do
            echo "::group::$dir"
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm add "$CORE_TARBALL" "$VITEST_TARBALL" && pnpm test) \
              || failed+=("$dir")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed on attest main: ${failed[*]}"
            exit 1
          fi
