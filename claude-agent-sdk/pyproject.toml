[project]
name = "attest-claude-agent-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "attest-ai==1.0.0rc5",
    "pytest>=8.0",
    "claude-agent-sdk==0.2.177",
]

[tool.pytest.ini_options]
testpaths = ["."]
# Replay runs the real agent against the committed fixture: a request with no recording fails the
# test, and a direct connection to a provider host fails instead of going live.
addopts = "--attest-replay=strict --attest-egress=block"
